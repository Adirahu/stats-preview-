<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Stats preview card component</title>
    <link rel="stylesheet" href="stats.css">
</head>
<body>
    <main class="card">
        <section class="card__content">
            <h1>Get <span>insights</span> that help your business grow.</h1>
            <p>
                Discover the benefits of data analytics and make better decisions regarding revenue,
                customer experience, and overall efficiency.
            </p>

            <div class="stats" aria-label="Business statistics">
                <div class="stat">
                    <h2>10k+</h2>
                    <span>companies</span>
                </div>
                <div class="stat">
                    <h2>314</h2>
                    <span>templates</span>
                </div>
                <div class="stat">
                    <h2>12M+</h2>
                    <span>queries</span>
                </div>
            </div>
        </section>

        <div class="card__image" aria-label="People working together in an office">
            <img src="image.png" alt="People working together in an office">
            <div class="overlay" aria-hidden="true"></div>
        </div>
    </main>
</body>
</html>
